name: Release

# Publishes signed, zipaligned APKs as a GitHub Release when a version tag is
# pushed, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # required to create the release and upload assets

jobs:
  release:
    name: Build signed APKs and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Run the test gates first so a tag never ships a broken build.
      - name: Native host tests
        run: ./native-tests/run_tests.sh

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See docs/release.md." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signatures and alignment
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          fail=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk =="
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk" || fail=1
            "$BUILD_TOOLS/zipalign" -c -v 4 "$apk" >/dev/null && echo "4-byte aligned: OK" || fail=1
          done
          exit $fail

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
